<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#991b1b" />
  <title>ΠΡΟΩΣΗ STEM — Διαχείριση</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23991b1b'/><text x='50' y='73' font-size='68' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'>Π</text></svg>" />
  <link rel="apple-touch-icon" href="proosi stem_original (1).jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

  <!-- Top Bar -->
  <header class="bg-red-800 text-white p-3.5 sticky top-0 z-20 shadow">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <img src="proosi stem_original (1).jpg" alt="ΠΡΟΩΣΗ STEM" class="w-9 h-9 rounded-xl object-contain bg-white p-0.5 shadow-sm" />
        <div>
          <h1 class="font-bold text-base leading-tight tracking-wide">ΠΡΟΩΣΗ STEM</h1>
          <p id="headerSubtitle" class="text-[11px] text-red-200">Πίνακας Καθηγητή</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <select id="tutorSelect" class="bg-red-900 text-white text-xs rounded-lg px-2.5 py-1.5 border border-red-700 outline-none">
          <option>Φόρτωση...</option>
        </select>
        <button onclick="toggleAppMode()" id="modeToggleBtn" class="bg-white text-red-900 font-bold text-xs px-2.5 py-1.5 rounded-lg shadow-sm active:scale-95 transition">
          Admin
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-xl mx-auto p-4 space-y-4">
    <div id="statusMsg" class="hidden text-center text-sm py-2 px-3 rounded-lg bg-emerald-100 text-emerald-800 font-medium"></div>
    <div id="content" class="space-y-3"></div>
  </main>

  <!-- ================= MODALS ================= -->

  <!-- 1. Modal Προσθήκης Ωρών (Καθηγητής) -->
  <div id="hoursModal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-xl">
      <div>
        <h2 class="font-bold text-lg text-slate-900">Καταχώριση Ωρών</h2>
        <p id="modalSubtitle" class="text-sm text-slate-500"></p>
        <p id="modalPackageInfo" class="hidden text-xs font-semibold text-red-800 bg-red-50 px-2.5 py-1.5 rounded-lg mt-2"></p>
      </div>
      <input type="hidden" id="mRequestId" />

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600">Ημερομηνία</label>
          <input id="mDate" type="date" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Ώρες</label>
          <input id="mHours" type="number" step="0.5" min="0.5" value="2" oninput="updateHoursPreview()" class="w-full mt-1 border rounded-lg p-2.5 text-sm font-bold" />
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 items-center">
        <div>
          <label class="text-xs font-semibold text-slate-600">Άτομα (1-7)</label>
          <input id="mStudentsCount" type="number" min="1" max="7" value="1" oninput="updateHoursPreview()" class="w-full mt-1 border rounded-lg p-2 text-sm" />
        </div>
        <div class="pt-4">
          <label class="flex items-center gap-1.5 text-xs font-medium cursor-pointer">
            <input id="mUnistudents" type="checkbox" class="w-4 h-4 rounded accent-red-800" />
            <span>Unistudents</span>
          </label>
        </div>
        <div class="pt-4">
          <label class="flex items-center gap-1.5 text-xs font-medium cursor-pointer">
            <input id="mPromo" type="checkbox" onchange="updateHoursPreview()" class="w-4 h-4 rounded accent-red-800" />
            <span>Promo (0€)</span>
          </label>
        </div>
      </div>

      <div id="hoursEarningPreview" class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-600 font-medium space-y-0.5"></div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Περιεχόμενο / Σημείωση</label>
        <input id="mContent" type="text" placeholder="π.χ. Κεφ. 3, ασκήσεις SPSS" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal('hoursModal')" class="flex-1 py-2.5 rounded-xl border border-slate-300 font-medium text-slate-700">Ακύρωση</button>
        <button onclick="saveHours()" class="flex-1 py-2.5 rounded-xl bg-red-800 text-white font-semibold">Αποθήκευση</button>
      </div>
    </div>
  </div>

  <!-- 2. Modal Νέας Επιθυμίας / Ανάθεσης (Admin) -->
  <div id="newRequestModal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3.5 shadow-xl my-auto">
      <h2 class="font-bold text-lg text-slate-900">Νέα Επιθυμία / Ανάθεση</h2>

      <div class="flex gap-2 text-xs">
        <button type="button" id="btnExistingStudent" onclick="toggleStudentMode('existing')" class="flex-1 py-2 rounded-lg bg-red-800 text-white font-semibold">Υπάρχων Φοιτητής</button>
        <button type="button" id="btnNewStudent" onclick="toggleStudentMode('new')" class="flex-1 py-2 rounded-lg bg-slate-100 text-slate-700 font-semibold">+ Νέος Φοιτητής</button>
      </div>

      <div id="existingStudentBox">
        <label class="text-xs font-semibold text-slate-600">Επιλογή Φοιτητή</label>
        <select id="nrStudentSelect" class="w-full mt-1 border rounded-lg p-2.5 text-sm"></select>
      </div>

      <div id="newStudentBox" class="hidden space-y-2 bg-slate-50 p-3 rounded-xl border">
        <div class="grid grid-cols-2 gap-2">
          <input id="nsLastName" type="text" placeholder="Επίθετο *" class="border rounded-lg p-2 text-sm bg-white" />
          <input id="nsFirstName" type="text" placeholder="Όνομα *" class="border rounded-lg p-2 text-sm bg-white" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input id="nsInstitution" type="text" placeholder="Ίδρυμα (π.χ. ΠΑΔΑ)" class="border rounded-lg p-2 text-sm bg-white" />
          <input id="nsDepartment" type="text" placeholder="Σχολή" class="border rounded-lg p-2 text-sm bg-white" />
        </div>
        <input id="nsPhone" type="tel" placeholder="Τηλέφωνο" class="w-full border rounded-lg p-2 text-sm bg-white" />
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Μάθημα *</label>
        <input id="nrCourse" type="text" placeholder="π.χ. ΣΤΑΤΙΣΤΙΚΗ Ι" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600">Καθηγητής *</label>
          <select id="nrTutorSelect" class="w-full mt-1 border rounded-lg p-2.5 text-sm"></select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Εξάμηνο</label>
          <input id="nrSemester" type="text" value="ΧΕΙΜΕΡΙΝΟ '26" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 items-center">
        <div>
          <label class="text-xs font-semibold text-slate-600">Επιλογή Προγράμματος</label>
          <select id="nrPackageSelect" onchange="onPackageChange()" class="w-full mt-1 border rounded-lg p-2 text-xs font-medium"></select>
        </div>
        <div>
          <label id="nrRateLabel" class="text-xs font-semibold text-slate-600">Χρέωση Φοιτητή (€)</label>
          <input id="nrAmountInput" type="number" step="0.5" class="w-full mt-1 border rounded-lg p-2 text-sm font-bold" />
        </div>
      </div>

      <div id="nrBillingSummary" class="text-xs bg-red-50 text-red-900 border border-red-100 rounded-lg p-2.5 font-medium"></div>

      <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-lg border border-slate-200">
        <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
          <input id="nrIsUnistudents" type="checkbox" class="w-4 h-4 rounded accent-red-800" />
          <span>Μέσω Unistudents (-15%)</span>
        </label>
        <span class="text-[11px] text-slate-500">Αμοιβή καθηγ.: ανά άτομα</span>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Σχόλια / Παρατηρήσεις</label>
        <input id="nrComments" type="text" placeholder="π.χ. Τμήμα 2 ατόμων" class="w-full mt-1 border rounded-lg p-2 text-sm" />
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal('newRequestModal')" class="flex-1 py-2.5 rounded-xl border border-slate-300 font-medium text-slate-700">Ακύρωση</button>
        <button onclick="saveNewRequest()" class="flex-1 py-2.5 rounded-xl bg-red-800 text-white font-semibold">Καταχώριση</button>
      </div>
    </div>
  </div>

  <!-- 3. Modal Πληρωμής / Εξόδου (Admin) -->
  <div id="paymentModal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3.5 shadow-xl">
      <h2 id="pmTitle" class="font-bold text-lg text-slate-900">Καταχώριση Κίνησης</h2>
      <input type="hidden" id="pmType" />

      <div id="pmStudentWrap" class="hidden">
        <label class="text-xs font-semibold text-slate-600">Φοιτητής</label>
        <select id="pmStudentSelect" class="w-full mt-1 border rounded-lg p-2.5 text-sm"></select>
      </div>

      <div id="pmTutorWrap" class="hidden">
        <label class="text-xs font-semibold text-slate-600">Καθηγητής</label>
        <select id="pmTutorSelect" class="w-full mt-1 border rounded-lg p-2.5 text-sm"></select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600">Ημερομηνία</label>
          <input id="pmDate" type="date" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Ποσό Ταμείου (€)</label>
          <input id="pmAmount" type="number" step="0.01" oninput="updateCreditPreview()" class="w-full mt-1 border rounded-lg p-2.5 text-sm font-bold" />
        </div>
      </div>

      <div id="pmReceiptWrap" class="hidden space-y-1">
        <label class="text-xs font-semibold text-slate-600">Τρόπος / Απόδειξη</label>
        <select id="pmReceipt" onchange="updateCreditPreview()" class="w-full border rounded-lg p-2.5 text-sm">
          <option value="ΜΕ ΑΠΟΔΕΙΞΗ">Με Απόδειξη (0% έκπτωση)</option>
          <option value="ΧΩΡΙΣ ΑΠΟΔΕΙΞΗ">Χωρίς Απόδειξη (+10% πίστωση)</option>
        </select>
        <p id="pmCreditPreview" class="text-xs text-emerald-700 font-semibold"></p>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Κατηγορία / Σημείωση</label>
        <input id="pmNotes" type="text" placeholder="π.χ. Προκαταβολή πακέτου / Εξόφληση" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal('paymentModal')" class="flex-1 py-2.5 rounded-xl border border-slate-300 font-medium text-slate-700">Ακύρωση</button>
        <button onclick="savePayment()" class="flex-1 py-2.5 rounded-xl bg-red-800 text-white font-semibold">Αποθήκευση</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottomNav" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-20"></nav>

  <script>
    const SUPABASE_URL = 'https://bjgmnxvkxyfntxdeqslh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_suwNR0mKPuLIrvMbiTE5-g_Xuay6v-R';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let appMode = 'tutor';
    let currentTab = 'active';
    let currentTutorId = null;
    let studentInputMode = 'existing';

    let tutors = [];
    let students = [];
    let requests = [];
    let logs = [];
    let payments = [];
    let packages = [];
    let rateTiers = [];

    function showToast(msg) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function init() {
      await loadAllData();
      const sel = document.getElementById('tutorSelect');
      sel.innerHTML = tutors.map(t => `<option value="${t.id}">${t.short_name}</option>`).join('');
      if (tutors.length > 0 && !currentTutorId) {
        currentTutorId = tutors[0].id;
      }
      sel.onchange = (e) => { currentTutorId = e.target.value; render(); };
      renderNav();
      render();
    }

    async function loadAllData() {
      const [tRes, sRes, rRes, lRes, pRes, pkgRes, tierRes] = await Promise.all([
        db.from('tutors').select('*').order('short_name'),
        db.from('students').select('*').order('last_name'),
        db.from('requests').select('*, students(last_name, first_name, phone, institution, department), tutors(short_name)').order('request_date', { ascending: false }),
        db.from('lesson_logs').select('*, students(last_name, first_name), tutors(short_name)').order('lesson_date', { ascending: false }),
        db.from('payments').select('*, students(last_name, first_name), tutors(short_name)').order('payment_date', { ascending: false }),
        db.from('pricing_packages').select('*').order('sort_order'),
        db.from('tutor_rate_tiers').select('*').order('num_students')
      ]);

      tutors = tRes.data || [];
      students = sRes.data || [];
      requests = rRes.data || [];
      logs = lRes.data || [];
      payments = pRes.data || [];
      packages = pkgRes.data || [];
      rateTiers = tierRes.data || [];
    }

    function getTutorHourlyForGroup(numStudents) {
      const n = Math.min(Math.max(Number(numStudents || 1), 1), 7);
      const tier = rateTiers.find(t => t.num_students === n);
      const fallback = { 1: 15, 2: 18, 3: 22, 4: 27, 5: 33, 6: 40, 7: 48 };
      const groupTotal = tier ? Number(tier.total_hourly_rate) : fallback[n];
      return groupTotal / n;
    }

    function getUsedHoursForRequest(reqId) {
      return logs.filter(l => l.request_id === reqId).reduce((sum, l) => sum + Number(l.hours || 0), 0);
    }

    function toggleAppMode() {
      appMode = appMode === 'tutor' ? 'admin' : 'tutor';
      const btn = document.getElementById('modeToggleBtn');
      const sub = document.getElementById('headerSubtitle');
      const sel = document.getElementById('tutorSelect');

      if (appMode === 'admin') {
        btn.textContent = 'Καθηγητής';
        sub.textContent = 'Διαχείριση & Ταμείο';
        sel.classList.add('hidden');
        currentTab = 'admin_requests';
      } else {
        btn.textContent = 'Admin';
        sub.textContent = 'Πίνακας Καθηγητή';
        sel.classList.remove('hidden');
        currentTab = 'active';
      }
      renderNav();
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      renderNav();
      render();
    }

    function renderNav() {
      const nav = document.getElementById('bottomNav');
      const tabs = appMode === 'tutor'
        ? [
            { id: 'active', label: 'Ενεργά' },
            { id: 'pending', label: 'Επιθυμίες' },
            { id: 'logs', label: 'Ώρες & Κέρδη' }
          ]
        : [
            { id: 'admin_requests', label: 'Αναθέσεις' },
            { id: 'admin_cash', label: 'Ταμείο' },
            { id: 'admin_payments', label: 'Κινήσεις' },
            { id: 'admin_students', label: 'Φοιτητές' },
            { id: 'admin_prices', label: 'Τιμές' }
          ];

      const gridClass = tabs.length === 3 ? 'grid-cols-3' : 'grid-cols-5';
      nav.innerHTML = `<div class="max-w-xl mx-auto grid ${gridClass} text-xs font-medium">` +
        tabs.map(t => `
          <button onclick="setTab('${t.id}')" class="py-3 flex flex-col items-center gap-1 ${currentTab === t.id ? 'text-red-800 border-t-2 border-red-800 font-bold' : 'text-slate-500'}">
            <span>${t.label}</span>
          </button>`).join('') + `</div>`;
    }

    function getStudentBalance(student) {
      const prev = Number(student.previous_balance || 0);
      const upfrontPackages = requests
        .filter(r => r.student_id === student.id && r.status !== 'ΑΚΥΡΩΘΗΚΕ')
        .reduce((s, r) => s + Number(r.upfront_charge || 0), 0);
      const hourlyCharged = logs
        .filter(l => l.student_id === student.id)
        .reduce((s, l) => s + Number(l.total_charge || 0), 0);
      const credited = payments
        .filter(p => p.student_id === student.id && p.type === 'STUDENT_PAYMENT')
        .reduce((s, p) => s + Number(p.credited_amount || 0), 0);
      return +(prev + upfrontPackages + hourlyCharged - credited).toFixed(2);
    }

    function getTutorBalance(tutorId) {
      const earned = logs.filter(l => l.tutor_id === tutorId).reduce((s, l) => s + Number(l.tutor_earning || 0), 0);
      const paid = payments.filter(p => p.tutor_id === tutorId && p.type === 'TUTOR_PAYOUT').reduce((s, p) => s + Number(p.amount || 0), 0);
      return +(earned - paid).toFixed(2);
    }

    function render() {
      const container = document.getElementById('content');

      // ================= ΠΡΟΒΟΛΗ ΚΑΘΗΓΗΤΗ =================
      if (appMode === 'tutor') {
        const myReqs = requests.filter(r => r.tutor_id === currentTutorId);
        const myLogs = logs.filter(l => l.tutor_id === currentTutorId);

        if (currentTab === 'active') {
          const active = myReqs.filter(r => r.status === 'OK');
          if (!active.length) {
            container.innerHTML = '<p class="text-center text-slate-500 py-8 text-sm">Δεν υπάρχουν ενεργά μαθήματα.</p>';
            return;
          }
          container.innerHTML = active.map(r => {
            const s = r.students || {};
            const hrs = getUsedHoursForRequest(r.id);
            const pkgHrs = Number(r.package_hours || 0);
            const isPkg = pkgHrs > 0;
            const remaining = +(pkgHrs - hrs).toFixed(2);

            const hoursBadge = isPkg
              ? `<div class="text-base font-extrabold ${remaining <= 0 ? 'text-red-600' : 'text-red-800'}">${hrs} / ${pkgHrs} ώρ.</div>
                 <div class="text-[11px] font-semibold ${remaining <= 0 ? 'text-red-600' : 'text-emerald-700'}">
                   ${remaining > 0 ? `Υπόλοιπο: ${remaining} ώρ.` : 'Εξαντλήθηκε'}
                 </div>`
              : `<div class="text-lg font-extrabold text-red-800">${hrs} ώρ.</div>
                 <div class="text-[11px] text-slate-400">Σύνολο</div>`;

            return `
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-start gap-2">
                  <div>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-50 text-red-800">${r.lesson_type || 'ΙΔΙΑΙΤΕΡΟ ΜΑΘΗΜΑ'}</span>
                    <h3 class="font-bold text-base mt-1">${s.last_name || ''} ${s.first_name || ''}</h3>
                    <p class="text-sm text-slate-700 font-medium">${r.course_title_snapshot || ''}</p>
                    <p class="text-xs text-slate-500">${s.institution || ''} • ${s.department || ''}</p>
                  </div>
                  <div class="text-right shrink-0">${hoursBadge}</div>
                </div>
                <div class="flex gap-2 pt-1">
                  <button onclick="openHoursModal('${r.id}')" class="flex-1 bg-red-800 text-white py-2.5 rounded-xl font-semibold text-sm active:scale-95 transition">
                    + Προσθήκη Ωρών
                  </button>
                  <button onclick="completeRequest('${r.id}')" class="px-3.5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium border border-slate-200">
                    Ολοκλήρωση
                  </button>
                </div>
              </div>`;
          }).join('');
        }

        else if (currentTab === 'pending') {
          const pending = myReqs.filter(r => r.status === 'ΕΚΚΡΕΜΕΣ');
          if (!pending.length) {
            container.innerHTML = '<p class="text-center text-slate-500 py-8 text-sm">Δεν υπάρχουν εκκρεμείς επιθυμίες.</p>';
            return;
          }
          container.innerHTML = pending.map(r => {
            const s = r.students || {};
            const pkgInfo = Number(r.package_hours || 0) > 0
              ? `${r.lesson_type} (${r.package_hours} ώρες)`
              : (r.lesson_type || 'ΙΔΙΑΙΤΕΡΟ ΜΑΘΗΜΑ');
            return `
              <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-amber-400 space-y-3">
                <div>
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">${r.semester_label || ''}</span>

    // --- ΛΕΙΤΟΥΡΓΙΕΣ ΚΑΘΗΓΗΤΗ ---
    function openHoursModal(reqId) {
      const r = requests.find(x => x.id === reqId);
      if (!r) return;
      document.getElementById('mRequestId').value = r.id;
      document.getElementById('modalSubtitle').textContent = `${r.students?.last_name} ${r.students?.first_name} — ${r.course_title_snapshot}`;
      document.getElementById('mDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('mHours').value = 2;

      const isGroup = Number(r.package_hours || 0) > 1 || r.lesson_type === 'ΕΛΕΥΘΕΡΟ ΤΜΗΜΑ';
      document.getElementById('mStudentsCount').value = isGroup ? 2 : 1;
      document.getElementById('mContent').value = '';
      document.getElementById('mUnistudents').checked = Boolean(r.is_unistudents || r.lesson_type === 'UNISTUDENTS');
      document.getElementById('mPromo').checked = false;

      const pkgBanner = document.getElementById('modalPackageInfo');
      if (Number(r.package_hours || 0) > 0) {
        const used = getUsedHoursForRequest(r.id);
        const rem = +(Number(r.package_hours) - used).toFixed(2);
        pkgBanner.textContent = `Προπληρωμένο Πακέτο: ${used} / ${r.package_hours} ώρ. (Υπόλοιπο: ${Math.max(0, rem)} ώρ.)`;
        pkgBanner.classList.remove('hidden');
      } else {
        pkgBanner.classList.add('hidden');
      }

      updateHoursPreview();
      document.getElementById('hoursModal').classList.remove('hidden');
    }

    function updateHoursPreview() {
      const reqId = document.getElementById('mRequestId').value;
      const r = requests.find(x => x.id === reqId);
      const hours = Number(document.getElementById('mHours').value || 0);
      const count = Number(document.getElementById('mStudentsCount').value || 1);
      const isPromo = document.getElementById('mPromo').checked;
      const ratePerStudent = getTutorHourlyForGroup(count);
      const earning = +(hours * ratePerStudent).toFixed(2);

      let chargeNote = '';
      if (r) {
        const pkgHrs = Number(r.package_hours || 0);
        if (isPromo) {
          chargeNote = 'Χρέωση φοιτητή: 0€ (Promo)';
        } else if (pkgHrs > 0) {
          const used = getUsedHoursForRequest(r.id);
          const extraHrs = Math.max(0, (used + hours) - Math.max(used, pkgHrs));
          chargeNote = extraHrs > 0
            ? `Προσοχή: +${extraHrs} ώρ. εκτός πακέτου (χρέωση ${+(extraHrs * 25).toFixed(2)}€)`
            : 'Χρέωση φοιτητή: 0€ (καλύπτεται από το πακέτο)';
        } else {
          const sRate = r.student_hourly_rate != null ? Number(r.student_hourly_rate) : 30;
          chargeNote = `Χρέωση φοιτητή: ${+(hours * sRate).toFixed(2)}€`;
        }
      }

      document.getElementById('hoursEarningPreview').innerHTML =
        `<div>Αμοιβή καθηγητή (${count} άτ.): <strong>${ratePerStudent.toFixed(2)}€/ώρ × ${hours} ώρ. = ${earning}€</strong></div>
         <div class="text-[11px] text-slate-500">${chargeNote}</div>`;
    }

    async function saveHours() {
      const reqId = document.getElementById('mRequestId').value;
      const r = requests.find(x => x.id === reqId);
      if (!r) return;

      const hours = Number(document.getElementById('mHours').value);
      if (!hours || hours <= 0) { alert('Βάλε έγκυρες ώρες.'); return; }

      const numStudents = Number(document.getElementById('mStudentsCount').value || 1);
      const isUni = document.getElementById('mUnistudents').checked;
      const isPromo = document.getElementById('mPromo').checked;
      const pkgHrs = Number(r.package_hours || 0);

      let totalCharge = 0;
      if (!isPromo) {
        if (pkgHrs > 0) {
          const used = getUsedHoursForRequest(r.id);
          const extraHrs = Math.max(0, (used + hours) - Math.max(used, pkgHrs));
          totalCharge = +(extraHrs * 25).toFixed(2);
        } else {
          const sRate = r.student_hourly_rate != null ? Number(r.student_hourly_rate) : 30;
          totalCharge = +(hours * sRate).toFixed(2);
        }
      }

      const tRatePerStudent = getTutorHourlyForGroup(numStudents);
      const tutorEarning = +(hours * tRatePerStudent).toFixed(2);
      const effectiveValue = pkgHrs > 0 ? (hours * (Number(r.upfront_charge || 0) / pkgHrs)) : totalCharge;
      const uniEarning = (!isPromo && isUni && effectiveValue > 0) ? +(effectiveValue * 0.15).toFixed(2) : 0;
      const centerEarning = +(effectiveValue - tutorEarning - uniEarning).toFixed(2);

      const payload = {
        lesson_date: document.getElementById('mDate').value,
        tutor_id: currentTutorId,
        student_id: r.student_id,
        request_id: r.id,
        course_title: r.course_title_snapshot,
        category: isPromo ? 'PROMO' : (r.lesson_type || 'ΙΔΙΑΙΤΕΡΟ ΜΑΘΗΜΑ'),
        hours,
        num_students: numStudents,
        is_unistudents: isUni,
        is_promo: isPromo,
        total_charge: totalCharge,
        tutor_earning: tutorEarning,
        unistudents_earning: uniEarning,
        center_earning: centerEarning,
        content: document.getElementById('mContent').value.trim()
      };

      const { error } = await db.from('lesson_logs').insert(payload);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      closeModal('hoursModal');
      showToast('Οι ώρες καταχωρήθηκαν!');
      await loadAllData();
      render();
    }

    async function startRequest(reqId) {
      const { error } = await db.from('requests')
        .update({ status: 'OK', start_date: new Date().toISOString().split('T')[0] })
        .eq('id', reqId);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      showToast('Το μάθημα μεταφέρθηκε στα Ενεργά!');
      await loadAllData();
      setTab('active');
    }

    async function completeRequest(reqId) {
      if (!confirm('Να δηλωθεί το μάθημα ως Ολοκληρωμένο;')) return;
      const { error } = await db.from('requests')
        .update({ status: 'ΟΛΟΚΛΗΡΩΘΗΚΕ' })
        .eq('id', reqId);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      showToast('Το μάθημα ολοκληρώθηκε!');
      await loadAllData();
      render();
    }

      document.getElementById('btnExistingStudent').className = mode === 'existing' ? 'flex-1 py-2 rounded-lg bg-red-800 text-white font-semibold' : 'flex-1 py-2 rounded-lg bg-slate-100 text-slate-700 font-semibold';

    }

    function onPackageChange() {
      const sel = document.getElementById('nrPackageSelect');
      const opt = sel.options[sel.selectedIndex];
      if (!opt) return;
      const pkgHours = Number(opt.getAttribute('data-hours') || 1);
      const price = Number(opt.getAttribute('data-price') || 30);

      document.getElementById('nrAmountInput').value = price;
      if (pkgHours > 1) {
        document.getElementById('nrRateLabel').textContent = 'Εφάπαξ Ποσό Πακέτου (€)';
        document.getElementById('nrBillingSummary').textContent =
          `Τμήμα 2+ ατόμων • Ο φοιτητής χρεώνεται εξαρχής ${price}€ και δικαιούται ${pkgHours} ώρες μαθήματος.`;
      } else {
        const isOpenGroup = opt.value === 'ΕΛΕΥΘΕΡΟ ΤΜΗΜΑ';
        document.getElementById('nrRateLabel').textContent = 'Χρέωση ανά Ώρα (€/ώρ)';
        document.getElementById('nrBillingSummary').textContent = isOpenGroup
          ? `Τμήμα 2+ ατόμων • Χρεώνεται ${price}€ ανά ώρα που πραγματοποιεί.`
          : `Ιδιαίτερο 1 ατόμου • Χρεώνεται ${price}€ ανά ώρα που πραγματοποιεί.`;
      }
    }

    async function saveNewRequest() {
      let studentId = document.getElementById('nrStudentSelect').value;

      if (studentInputMode === 'new') {
        const lastName = document.getElementById('nsLastName').value.trim().toUpperCase();
        const firstName = document.getElementById('nsFirstName').value.trim().toUpperCase();
        if (!lastName || !firstName) { alert('Συμπλήρωσε Επίθετο και Όνομα φοιτητή.'); return; }

        const { data: newS, error: sErr } = await db.from('students').insert({
          last_name: lastName,
          first_name: firstName,
          institution: document.getElementById('nsInstitution').value.trim().toUpperCase(),
          department: document.getElementById('nsDepartment').value.trim().toUpperCase(),
          phone: document.getElementById('nsPhone').value.trim()
        }).select().single();

        if (sErr) { alert('Σφάλμα φοιτητή: ' + sErr.message); return; }
        studentId = newS.id;
      }

      const course = document.getElementById('nrCourse').value.trim().toUpperCase();
      if (!course) { alert('Συμπλήρωσε το Μάθημα.'); return; }

      const sel = document.getElementById('nrPackageSelect');
      const opt = sel.options[sel.selectedIndex];
      const pkgName = opt.value;
      const pkgHours = Number(opt.getAttribute('data-hours') || 1);
      const enteredAmount = Number(document.getElementById('nrAmountInput').value);
      const isUni = document.getElementById('nrIsUnistudents').checked;

      const isPackage = pkgHours > 1;

      const { error } = await db.from('requests').insert({
        student_id: studentId,
        course_title_snapshot: course,
        tutor_id: document.getElementById('nrTutorSelect').value,
        semester_label: document.getElementById('nrSemester').value.trim(),
        lesson_type: pkgName,
        package_hours: isPackage ? pkgHours : 0,
        upfront_charge: isPackage ? enteredAmount : 0,
        student_hourly_rate: isPackage ? 0 : enteredAmount,
        tutor_hourly_rate: 15,
        is_unistudents: isUni,
        student_comments: document.getElementById('nrComments').value.trim(),
        status: 'ΕΚΚΡΕΜΕΣ'
      });

      if (error) { alert('Σφάλμα ανάθεσης: ' + error.message); return; }
      closeModal('newRequestModal');
      showToast(isPackage
        ? `Το πακέτο ανατέθηκε και χρεώθηκαν ${enteredAmount}€ εξαρχής!`
        : 'Η επιθυμία ανατέθηκε στον καθηγητή!');
      await loadAllData();
      render();
    }

    async function updatePackagePrice(id) {
      const val = Number(document.getElementById(`pkg_${id}`).value);
      const { error } = await db.from('pricing_packages').update({ total_price: val }).eq('id', id);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      showToast('Η τιμή ενημερώθηκε!');
      await loadAllData();
      render();
    }

    async function updateTierRate(numStudents) {
      const val = Number(document.getElementById(`tier_${numStudents}`).value);
      const { error } = await db.from('tutor_rate_tiers').update({ total_hourly_rate: val }).eq('num_students', numStudents);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      showToast('Η αμοιβή καθηγητή ενημερώθηκε!');
      await loadAllData();
      render();
    }

    function openPaymentModal(type, entityId = '', defaultAmount = '') {
      document.getElementById('pmType').value = type;
      document.getElementById('pmDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('pmAmount').value = defaultAmount;
      document.getElementById('pmNotes').value = '';

      document.getElementById('pmStudentWrap').classList.toggle('hidden', type !== 'STUDENT_PAYMENT');
      document.getElementById('pmReceiptWrap').classList.toggle('hidden', type !== 'STUDENT_PAYMENT');
      document.getElementById('pmTutorWrap').classList.toggle('hidden', type !== 'TUTOR_PAYOUT');

      if (type === 'STUDENT_PAYMENT') {
        document.getElementById('pmTitle').textContent = 'Είσπραξη από Φοιτητή';
        document.getElementById('pmStudentSelect').innerHTML = students.map(s => `<option value="${s.id}" ${s.id === entityId ? 'selected' : ''}>${s.last_name} ${s.first_name}</option>`).join('');
        updateCreditPreview();
      } else if (type === 'TUTOR_PAYOUT') {
        document.getElementById('pmTitle').textContent = 'Πληρωμή Καθηγητή';
        document.getElementById('pmTutorSelect').innerHTML = tutors.map(t => `<option value="${t.id}" ${t.id === entityId ? 'selected' : ''}>${t.short_name}</option>`).join('');
      } else {
        document.getElementById('pmTitle').textContent = 'Καταχώριση Εξόδου';
      }

      document.getElementById('paymentModal').classList.remove('hidden');
    }

    function updateCreditPreview() {
      const amt = Number(document.getElementById('pmAmount').value || 0);
      const rec = document.getElementById('pmReceipt').value;
      const cred = rec === 'ΧΩΡΙΣ ΑΠΟΔΕΙΞΗ' ? +(amt / 0.9).toFixed(2) : amt;
      document.getElementById('pmCreditPreview').textContent = amt > 0 ? `Πίστωση στην καρτέλα φοιτητή: ${cred} €` : '';
    }

    async function savePayment() {
      const type = document.getElementById('pmType').value;
      const amount = Number(document.getElementById('pmAmount').value);
      if (!amount || amount <= 0) { alert('Βάλε έγκυρο ποσό.'); return; }

      const rec = document.getElementById('pmReceipt').value;
      const credited = (type === 'STUDENT_PAYMENT' && rec === 'ΧΩΡΙΣ ΑΠΟΔΕΙΞΗ') ? +(amount / 0.9).toFixed(2) : amount;

      const payload = {
        payment_date: document.getElementById('pmDate').value,
        type,
        student_id: type === 'STUDENT_PAYMENT' ? document.getElementById('pmStudentSelect').value : null,
        tutor_id: type === 'TUTOR_PAYOUT' ? document.getElementById('pmTutorSelect').value : null,
        amount,
        credited_amount: credited,
        receipt_type: type === 'STUDENT_PAYMENT' ? rec : null,
        notes: document.getElementById('pmNotes').value.trim()
      };

      const { error } = await db.from('payments').insert(payload);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      closeModal('paymentModal');
      showToast('Η οικονομική κίνηση καταχωρήθηκε!');
      await loadAllData();
      render();
    }

    init();
  </script>
</body>
</html>
