<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#991b1b" />
  <title>ΠΡΟΩΣΗ STEM — Διαχείριση Καθηγητή</title>
  <link rel="icon" type="image/jpeg" href="proosi stem_original (1).jpg" />
  <link rel="apple-touch-icon" href="proosi stem_original (1).jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

  <!-- Top Bar -->
  <header class="bg-red-800 text-white p-4 sticky top-0 z-20 shadow">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <img src="proosi stem_original (1).jpg" alt="ΠΡΟΩΣΗ STEM" class="w-10 h-10 rounded-xl object-contain bg-white p-1 shadow-sm" />
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide">ΠΡΟΩΣΗ STEM</h1>
          <p class="text-xs text-red-200">Πίνακας Καθηγητή</p>
        </div>
      </div>
      <select id="tutorSelect" class="bg-red-900 text-white text-sm rounded-lg px-3 py-1.5 border border-red-700 outline-none">
        <option>Φόρτωση...</option>
      </select>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-lg mx-auto p-4 space-y-4">
    <div id="statusMsg" class="hidden text-center text-sm py-2 px-3 rounded-lg bg-emerald-100 text-emerald-800 font-medium"></div>
    <div id="content" class="space-y-3"></div>
  </main>

  <!-- Modal Προσθήκης Ωρών -->
  <div id="hoursModal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-xl">
      <div>
        <h2 class="font-bold text-lg text-slate-900">Καταχώριση Ωρών</h2>
        <p id="modalSubtitle" class="text-sm text-slate-500"></p>
      </div>
      <input type="hidden" id="mRequestId" />
      <input type="hidden" id="mStudentId" />
      <input type="hidden" id="mCourseTitle" />
      <input type="hidden" id="mLessonType" />

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600">Ημερομηνία</label>
          <input id="mDate" type="date" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Ώρες</label>
          <input id="mHours" type="number" step="0.5" min="0.5" value="2" class="w-full mt-1 border rounded-lg p-2.5 text-sm font-bold" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600">Άτομα</label>
          <input id="mStudentsCount" type="number" min="1" value="1" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
        </div>
        <div class="flex items-end pb-2">
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input id="mUnistudents" type="checkbox" class="w-4 h-4 rounded accent-red-800" />
            <span>Unistudents</span>
          </label>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Περιεχόμενο / Σημείωση (προαιρετικό)</label>
        <input id="mContent" type="text" placeholder="π.χ. Κεφ. 3, ασκήσεις SPSS" class="w-full mt-1 border rounded-lg p-2.5 text-sm" />
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 font-medium text-slate-700">Ακύρωση</button>
        <button onclick="saveHours()" class="flex-1 py-2.5 rounded-xl bg-red-800 text-white font-semibold">Αποθήκευση</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-20">
    <div class="max-w-lg mx-auto grid grid-cols-3 text-xs font-medium">
      <button onclick="setTab('active')" id="tab-active" class="py-3 flex flex-col items-center gap-1 text-red-800 border-t-2 border-red-800 font-bold">
        <span>Ενεργά</span>
      </button>
      <button onclick="setTab('pending')" id="tab-pending" class="py-3 flex flex-col items-center gap-1 text-slate-500">
        <span>Επιθυμίες</span>
      </button>
      <button onclick="setTab('logs')" id="tab-logs" class="py-3 flex flex-col items-center gap-1 text-slate-500">
        <span>Ώρες & Ιστορικό</span>
      </button>
    </div>
  </nav>

  <script>
    // === ΣΤΟΙΧΕΙΑ ΣΥΝΔΕΣΗΣ SUPABASE ===
    const SUPABASE_URL = 'https://bjgmnxvkxyfntxdeqslh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_suwNR0mKPuLIrvMbiTE5-g_Xuay6v-R';
    // ===================================

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'active';
    let currentTutorId = null;
    let tutors = [];
    let requests = [];
    let logs = [];

    function showToast(msg) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    async function init() {
      const { data, error } = await db.from('tutors').select('*').order('short_name');
      if (error) {
        document.getElementById('content').innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-xl text-sm">Σφάλμα σύνδεσης: ${error.message}</div>`;
        return;
      }
      tutors = data || [];
      const sel = document.getElementById('tutorSelect');
      sel.innerHTML = tutors.map(t => `<option value="${t.id}">${t.short_name}</option>`).join('');
      if (tutors.length > 0) {
        currentTutorId = tutors[0].id;
        sel.onchange = (e) => { currentTutorId = e.target.value; loadData(); };
        await loadData();
      }
    }

    async function loadData() {
      const [reqRes, logRes] = await Promise.all([
        db.from('requests')
          .select('*, students(last_name, first_name, phone, institution, department)')
          .eq('tutor_id', currentTutorId)
          .order('request_date', { ascending: false }),
        db.from('lesson_logs')
          .select('*, students(last_name, first_name)')
          .eq('tutor_id', currentTutorId)
          .order('lesson_date', { ascending: false })
      ]);

      requests = reqRes.data || [];
      logs = logRes.data || [];
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      ['active', 'pending', 'logs'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = 'py-3 flex flex-col items-center gap-1 text-red-800 border-t-2 border-red-800 font-bold';
        } else {
          btn.className = 'py-3 flex flex-col items-center gap-1 text-slate-500';
        }
      });
      render();
    }

    function getTotalHoursForRequest(reqId) {
      return logs.filter(l => l.request_id === reqId).reduce((sum, l) => sum + Number(l.hours || 0), 0);
    }

    function render() {
      const container = document.getElementById('content');

      if (currentTab === 'active') {
        const active = requests.filter(r => r.status === 'OK');
        if (!active.length) {
          container.innerHTML = '<p class="text-center text-slate-500 py-8 text-sm">Δεν υπάρχουν ενεργά μαθήματα.</p>';
          return;
        }
        container.innerHTML = active.map(r => {
          const s = r.students || {};
          const hrs = getTotalHoursForRequest(r.id);
          return `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-50 text-red-800">${r.lesson_type || 'ΙΔΙΑΙΤΕΡΟ'}</span>
                  <h3 class="font-bold text-base mt-1">${s.last_name || ''} ${s.first_name || ''}</h3>
                  <p class="text-sm text-slate-700 font-medium">${r.course_title_snapshot || ''}</p>
                  <p class="text-xs text-slate-500">${s.institution || ''} • ${s.department || ''}</p>
                </div>
                <div class="text-right shrink-0">
                  <div class="text-lg font-extrabold text-red-800">${hrs} ώρ.</div>
                  <div class="text-[11px] text-slate-400">Σύνολο</div>
                </div>
              </div>
              <div class="flex gap-2 pt-1">
                <button onclick="openHoursModal('${r.id}')" class="flex-1 bg-red-800 text-white py-2.5 rounded-xl font-semibold text-sm active:scale-95 transition">
                  + Προσθήκη Ωρών
                </button>
                <button onclick="completeRequest('${r.id}')" class="px-3.5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium border border-slate-200">
                  Ολοκλήρωση
                </button>
              </div>
            </div>`;
        }).join('');
      }

      else if (currentTab === 'pending') {
        const pending = requests.filter(r => r.status === 'ΕΚΚΡΕΜΕΣ');
        if (!pending.length) {
          container.innerHTML = '<p class="text-center text-slate-500 py-8 text-sm">Δεν υπάρχουν εκκρεμείς επιθυμίες.</p>';
          return;
        }
        container.innerHTML = pending.map(r => {
          const s = r.students || {};
          return `
            <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-amber-400 space-y-3">
              <div>
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">${r.semester_label || ''}</span>
                  ${s.phone ? `<a href="tel:${s.phone}" class="text-xs font-semibold text-red-700 underline">📞 ${s.phone}</a>` : ''}
                </div>
                <h3 class="font-bold text-base mt-1">${s.last_name || ''} ${s.first_name || ''}</h3>
                <p class="text-sm text-slate-700 font-medium">${r.course_title_snapshot || ''}</p>
                ${r.student_comments ? `<p class="text-xs text-slate-500 mt-1 bg-slate-50 p-2 rounded-lg">«${r.student_comments}»</p>` : ''}
              </div>
              <div class="flex gap-2">
                <button onclick="startRequest('${r.id}')" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-semibold text-sm">
                  ✓ Έναρξη Μαθήματος (OK)
                </button>
              </div>
            </div>`;
        }).join('');
      }

      else if (currentTab === 'logs') {
        const totalHrs = logs.reduce((s, l) => s + Number(l.hours || 0), 0);
        const header = `
          <div class="bg-red-800 text-white rounded-2xl p-4 flex justify-between items-center">
            <div>
              <p class="text-xs text-red-200">Συνολικές καταχωρημένες ώρες</p>
              <p class="text-2xl font-extrabold">${totalHrs} ώρες</p>
            </div>
            <div class="text-xs text-red-200">${logs.length} μαθήματα</div>
          </div>`;

        const list = logs.length ? logs.map(l => `
          <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
              <p class="text-xs text-slate-400">${l.lesson_date}</p>
              <p class="font-bold text-sm">${l.students?.last_name || ''} ${l.students?.first_name || ''}</p>
              <p class="text-xs text-slate-600">${l.course_title} ${l.content ? '• ' + l.content : ''}</p>
            </div>
            <div class="font-extrabold text-red-800 text-base">${l.hours} ώρ.</div>
          </div>`).join('') : '<p class="text-center text-slate-500 py-6 text-sm">Δεν έχουν καταχωρηθεί ώρες ακόμα.</p>';

        container.innerHTML = header + list;
      }
    }

    function openHoursModal(reqId) {
      const r = requests.find(x => x.id === reqId);
      if (!r) return;
      document.getElementById('mRequestId').value = r.id;
      document.getElementById('mStudentId').value = r.student_id;
      document.getElementById('mCourseTitle').value = r.course_title_snapshot;
      document.getElementById('mLessonType').value = r.lesson_type || 'ΙΔΙΑΙΤΕΡΟ';
      document.getElementById('modalSubtitle').textContent = `${r.students?.last_name} ${r.students?.first_name} — ${r.course_title_snapshot}`;
      document.getElementById('mDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('mHours').value = 2;
      document.getElementById('mContent').value = '';
      document.getElementById('mUnistudents').checked = (r.lesson_type === 'UNISTUDENTS');
      document.getElementById('hoursModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('hoursModal').classList.add('hidden');
    }

    async function saveHours() {
      const payload = {
        lesson_date: document.getElementById('mDate').value,
        tutor_id: currentTutorId,
        student_id: document.getElementById('mStudentId').value,
        request_id: document.getElementById('mRequestId').value,
        course_title: document.getElementById('mCourseTitle').value,
        category: document.getElementById('mLessonType').value,
        hours: Number(document.getElementById('mHours').value),
        num_students: Number(document.getElementById('mStudentsCount').value),
        is_unistudents: document.getElementById('mUnistudents').checked,
        content: document.getElementById('mContent').value.trim()
      };

      const { error } = await db.from('lesson_logs').insert(payload);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      closeModal();
      showToast('Οι ώρες αποθηκεύτηκαν!');
      await loadData();
    }

    async function startRequest(reqId) {
      const { error } = await db.from('requests')
        .update({ status: 'OK', start_date: new Date().toISOString().split('T')[0] })
        .eq('id', reqId);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      showToast('Το μάθημα μεταφέρθηκε στα Ενεργά!');
      setTab('active');
      await loadData();
    }

    async function completeRequest(reqId) {
      if (!confirm('Να δηλωθεί το μάθημα ως Ολοκληρωμένο;')) return;
      const { error } = await db.from('requests')
        .update({ status: 'ΟΛΟΚΛΗΡΩΘΗΚΕ' })
        .eq('id', reqId);
      if (error) { alert('Σφάλμα: ' + error.message); return; }
      showToast('Το μάθημα ολοκληρώθηκε!');
      await loadData();
    }

    init();
  </script>
</body>
</html>
